name: Extrato Java

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: extrato-java
        run: mvn -B -ntp verify
      - name: Confirm tests executed
        working-directory: extrato-java
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = list(Path("target/surefire-reports").glob("TEST-*.xml"))
          executed = sum(int(root.get("tests", 0)) - int(root.get("skipped", 0))
                         for root in (ET.parse(report).getroot() for report in reports))
          if executed < 1:
              raise SystemExit("No Java tests executed")
          print(f"Java tests executed: {executed}")
          '
